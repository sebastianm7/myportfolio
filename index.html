<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="css/style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/darkmode.css" />
    <link rel="icon" type="image/x-icon" href="imgs/jsmlogo.png" />
    <title id="mywebsite">Mi Portafolio</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <img src="imgs/jsmlogo.png" alt="" width="15%" height="15%" />
        </div>

        <ul class="menu">
          <li><a href="index.html" id="home">Inicio</a></li>
          <li><a href="html/aboutme.html" id="aboutme">Acerca de mi</a></li>
          <li><a href="html/projects.html" id="projects">Proyectos</a></li>
          <li><a href="html/certifications.html" id="certifications">Certificados</a></li>
          <li><a href="html/contact.html" id="contact">Contacto</a></li>
          <li class="theme-switcher">
            <button
              class="theme-toggle"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <img src="imgs/dark-lightmode.png" alt="Tema" />
            </button>
            <div class="theme-menu" role="menu">
              <button id="light" type="button" onclick="setLightMode()">
                Modo claro☀️
              </button>
              <button id="dark" type="button" onclick="setDarkMode()">
                Modo oscuro🌙
              </button>
            </div>
          </li>
          <li class="theme-switcher">
            <button
              class="theme-toggle"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <img src="imgs/language.png" alt="Tema" />
            </button>
            <div class="theme-menu" role="menu">
              <button class="spanishbutton" type="button" onclick="changeLanguage('es')">
                Español
              </button>
              <button class="englishbutton" type="button" onclick="changeLanguage('en')">
                English
              </button>
            </div>
          </li>
        </ul>
      </nav>
    </header>
    <main class="hero">
      <div class="editor" title="Puedes omitir la animación dando click">
        <span class="cursor" id="description"></span>
      </div>
    </main>
    <footer></footer>
    <footer><p></p></footer>
  </body>
  <script src="js/translations.js"></script>
  <script src="js/darkmode.js"></script>
  <script src="js/home.js"></script>
</html>
